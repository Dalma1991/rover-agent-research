<svg width="760" height="520" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Baseline vonalkovetokontroller allapotgepe (M10)</title>
<desc>Negy allapot: VONALON, AKADALY, VISSZATALALAS, KERESES. VONALON-bol akadaly eszleleskor AKADALY, vonalvesztesnel KERESES. AKADALY-bol az akadaly elhaladasa utan VISSZATALALAS, zsakutca (tul sok lepes) eseten KERESES. VISSZATALALAS-bol vonal megtalalasakor VONALON, tul sok lepes utan KERESES. KERESES-bol vonal megtalalasakor VONALON, tul sok lepes utan palyaelhagyas (nem allapot, terminalis jelzo).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- VONALON (bal felso) -->
<rect x="60" y="50" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="150" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#04342C">VONALON</text>

<!-- AKADALY (jobb felso) -->
<rect x="520" y="50" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="610" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#042C53">AKADALY</text>

<!-- KERESES (bal also) -->
<rect x="60" y="410" width="180" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="150" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#501313">KERESES</text>

<!-- VISSZATALALAS (jobb also) -->
<rect x="520" y="410" width="180" height="60" rx="8" fill="#FBF0DD" stroke="#B8752E" stroke-width="1"/>
<text x="610" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#5C3A12">VISSZATALALAS</text>

<!-- VONALON -> AKADALY -->
<line x1="240" y1="70" x2="520" y2="70" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">akadaly eszlelve (lidar)</text>

<!-- VONALON -> KERESES -->
<line x1="150" y1="110" x2="150" y2="410" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a" transform="rotate(-90 90 260)">vonalveszes</text>

<!-- KERESES -> VONALON -->
<line x1="180" y1="410" x2="180" y2="110" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="220" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a" transform="rotate(-90 220 260)">vonal megtalalva</text>

<!-- AKADALY self-loop (tovabbi fordulas) -->
<path d="M 610 50 C 610 10, 700 10, 700 50 C 700 70, 660 75, 630 60" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="700" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">meg akadaly (fordulas)</text>

<!-- AKADALY -> VISSZATALALAS -->
<line x1="610" y1="110" x2="610" y2="410" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="640" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">akadaly elhaladva</text>

<!-- AKADALY -> KERESES (zsakutca), diagonal -->
<line x1="530" y1="102" x2="230" y2="418" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="330" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#A32D2D">zsakutca (M10: max lepes utan)</text>

<!-- VISSZATALALAS -> VONALON, diagonal -->
<line x1="600" y1="405" x2="220" y2="115" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">vonal megtalalva (M10: uj)</text>

<!-- VISSZATALALAS -> KERESES -->
<line x1="520" y1="440" x2="240" y2="440" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="465" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">max lepes utan eszkalal</text>

<!-- KERESES terminal note -->
<text x="150" y="500" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#A32D2D" font-style="italic">max lepes utan: palyaelhagyas (terminalis)</text>

</svg>